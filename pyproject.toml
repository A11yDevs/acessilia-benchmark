[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acessilia-benchmark"
version = "0.2.0"
description = "Reproducible manual evaluation of Acessilia document conversion"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
datasets = ["huggingface_hub==1.33.0"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "Pillow==10.4.0", "PyMuPDF>=1.24,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers -ra"
markers = ["integration: uses real downloaded datasets and pinned official evaluators"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["acessilia_benchmark"]
