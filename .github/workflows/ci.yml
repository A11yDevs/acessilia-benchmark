name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.0"
      - run: uv sync --group dev --python 3.11.17
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync ruff format --check src tests
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync acessilia-benchmark --help
      - run: uv run --no-sync python -m acessilia_benchmark --help
      - run: uv run --no-sync acessilia-datasets list
      - run: uv build
